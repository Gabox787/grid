services:
  - type: web
    name: grid-trading-bot
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port 10000
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: EXCHANGE_ID
        value: binance
      - key: API_KEY
        sync: false
      - key: API_SECRET
        sync: false
      - key: SYMBOL
        value: BTC/USDT
      - key: UPPER_BOUND
        value: "84000"
      - key: LOWER_BOUND
        value: "70000"
      - key: GRID_STEP_USD
        value: "600"
      - key: DEPOSIT_USDT
        value: "2000"
      - key: CAPITAL_USAGE_RATIO
        value: "0.8"
      - key: EXTENSION_LEVELS
        value: "5"
      - key: POLL_INTERVAL
        value: "10"
      - key: DRY_RUN
        value: "true"
      - key: PLACE_INITIAL_SELLS
        value: "true"
      - key: FEE_RATE_PCT
        value: "0.001"
      - key: STALE_RESUME_THRESHOLD_SECONDS
        value: "1800"
      # Postgres для персистентности (Neon/Supabase, бесплатный тариф) — без него бот
      # просто живёт в памяти как раньше, без сохранения состояния между рестартами.
      - key: DATABASE_URL
        sync: false
      # Опционально: push по сделкам + команды управления + уведомления kill-switch в Telegram
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
